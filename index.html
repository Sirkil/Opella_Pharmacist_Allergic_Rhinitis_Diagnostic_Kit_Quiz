<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#650064">
  <meta name="description" content="فحص لأعراض الأنف والحساسية بإرشاد الصيدلي.">
  <title>فحص أعراض التهاب الأنف التحسسي</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./brand.css">
</head>
<body>
  <div class="app" id="app">
    <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="عرض بملء الشاشة" title="عرض بملء الشاشة" aria-pressed="false">
      <svg class="fullscreen-enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
      <svg class="fullscreen-exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
    </button>
    <div id="fullscreen-message" class="fullscreen-message" role="status" aria-live="polite"></div>
    <main class="workspace">
      <section class="journey" aria-label="فحص الأعراض">
        <div class="journey-top"><div class="journey-meta"><span id="section-name">فحص الأعراض</span><span id="progress-text">7 أسئلة قصيرة</span></div><div id="progress-track" class="progress-track" aria-label="تقدّم الفحص"></div></div>
        <div id="screen" class="screen" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="./config.js"></script>
  <script src="./script.js"></script>
  <script src="./fullscreen.js"></script>
</body>
</html>
